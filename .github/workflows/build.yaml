name: Build App

env:
  sdkVersion: "5.2.0.15"

on:
  push:
    branches-ignore:
      - 'main'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.markdownlint.yaml'
      - '.github/mlc_config.json'
      - '.github/workflows/markdownlint.yaml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.markdownlint.yaml'
      - '.github/mlc_config.json'
      - '.github/workflows/markdownlint.yaml'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Daemon job – builds the noarch background-service RPM FIRST.
  # Pure python + systemd units, no compilation: built with plain rpmbuild
  # inside the Sailfish platform SDK container. The app build below bundles
  # this RPM into /usr/share/harbour-find-my-device/daemon/ (sideload flow).
  # Version/Release are inherited from rpm/harbour-find-my-device.spec by the
  # daemon spec itself (single source of truth).
  # ──────────────────────────────────────────────
  daemon:
    name: Build daemon RPM (noarch)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build harbour-find-my-device-daemon
        run: |
          set -euo pipefail
          VERSION=$(grep '^Version:' rpm/harbour-find-my-device.spec | awk '{print $2}')
          git archive --format=tar --prefix="harbour-find-my-device-daemon-${VERSION}/" HEAD \
            | bzip2 > "harbour-find-my-device-daemon-${VERSION}.tar.bz2"
          mkdir -p daemon-rpm/RPMS
          docker run --rm -u 0:0 -v "$PWD:/work" \
            coderus/sailfishos-platform-sdk:${{ env.sdkVersion }} \
            bash -c "set -euo pipefail
              rpmbuild -bb /work/daemon-rpm/harbour-find-my-device-daemon.spec \
                --define '_sourcedir /work' \
                --define '_rpmdir /work/daemon-rpm/RPMS' \
                --define '_builddir /tmp/fmd-build'
              # flatten the noarch/ subdir so the app spec's bundling glob finds the file
              find /work/daemon-rpm/RPMS -mindepth 2 -name '*.rpm' -exec mv {} /work/daemon-rpm/RPMS/ \;
              chmod -R a+rX /work/daemon-rpm/RPMS"
          echo "Built:"
          ls -la daemon-rpm/RPMS/*.noarch.rpm

      - name: Upload daemon RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-find-my-device-daemon-noarch-SNAPSHOT
          path: daemon-rpm/RPMS/*.noarch.rpm
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build job – CI only, runs on feature branch pushes and PRs
  # Never runs on direct pushes to main (releases are handled by release.yaml)
  # Uses the CODeRUS Buildfish action for Sailfish OS 5.x
  # Coderepo for target releases: https://github.com/CODeRUS/docker-sailfishos-platform-sdk
  # https://github.com/CODeRUS/github-sfos-build
  # Available SDK releases: https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    # Avoid duplicate builds: on pull_request, only run for forks (push already covers internal branches)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: daemon
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The app spec auto-bundles the daemon RPM when it is present in
      # daemon-rpm/RPMS/ at build time.
      - name: Download daemon RPM (for bundling)
        uses: actions/download-artifact@v4
        with:
          name: harbour-find-my-device-daemon-noarch-SNAPSHOT
          path: daemon-rpm/RPMS

      - name: Build RPM package
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.sdkVersion }}
          arch: ${{ matrix.arch }}

      - name: "Harbour compliance check and Buildoutput"
        uses: ./.github/actions/checks
        with:
          arch: ${{ matrix.arch }}

      - name: Determine artifact name
        id: artifact-name
        run: |
          VERSION=$(grep '^Version:' rpm/harbour-find-my-device.spec | awk '{print $2}')
          RELEASE_NUM=$(grep '^Release:' rpm/harbour-find-my-device.spec | awk '{print $2}')
          NAME="harbour-find-my-device-${VERSION}-${RELEASE_NUM}-SNAPSHOT.${{ matrix.arch }}.rpm"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "📦 Artifact name: ${NAME}"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            RPMS/*.rpm
            !RPMS/*-debuginfo-*.rpm
            !RPMS/*-debugsource-*.rpm
          retention-days: 30
          if-no-files-found: error
