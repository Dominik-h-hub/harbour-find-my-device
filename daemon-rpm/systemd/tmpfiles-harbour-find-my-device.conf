# Find My Device: spool directory for privileged action requests.
# The root priv service (harbour-find-my-device-priv.service) reads requests here;
# the non-root user daemon writes them. Lives on tmpfs (/run), so it is recreated
# on every boot.
#
# Owned by the primary Sailfish user (defaultuser/nemo) that the user daemon
# runs as -- because that user is NOT reliably in the 'privileged' group. Root
# reads/drains the spool regardless of mode.
#
# uid/gid 100000 here is only the STATIC FALLBACK: the daemon package's %post
# resolves the real primary user via getent and writes a corrected copy to
# /etc/tmpfiles.d/ with the same filename, which overrides this file at boot.
d /run/harbour-find-my-device       0755 root root     -
d /run/harbour-find-my-device/spool 0700 100000 100000 -